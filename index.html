<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d57b7"><title>OSGB Coach 2020</title><style>:root{--b:#1d57b7;--bd:#123a7f;--y:#f4df28;--t:#112b5f;--m:#6b7b98;--br:#dce5f2;--bg:#f7f9fd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--br);padding:12px 16px;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(145deg,var(--b),var(--bd));color:#fff;display:grid;place-items:center;font-weight:900}.brand b{display:block;font-size:19px}.brand small{color:var(--m)}main{max-width:1100px;margin:auto;padding:18px 16px 90px}.title{font-size:30px;margin:0 0 4px}.sub{color:var(--m);margin:0 0 16px}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{background:#fff;border:1px solid var(--br);border-radius:16px;padding:15px;box-shadow:0 7px 24px #17396f10}.blue{background:linear-gradient(150deg,var(--b),var(--bd));color:#fff}.yellow{background:#fff9bd}.muted{color:var(--m)}.blue .muted{color:#dbe8ff}.kpi{font-size:30px;font-weight:900}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#eef5ff;color:var(--b);font-size:12px;font-weight:800}.py{background:#fff6a4;color:#665700}.btn{border:0;border-radius:11px;background:var(--b);color:#fff;padding:10px 13px;font-weight:800}.btn.alt{background:#fff;color:var(--b);border:1px solid var(--br)}.btn.y{background:var(--y);color:#3d3600}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 22px}.quick button{background:#fff;border:1px solid var(--br);border-radius:14px;min-height:88px;padding:12px;text-align:left;font-weight:800;color:var(--t)}.section{font-size:20px;font-weight:900;margin:22px 0 10px}.event{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--br)}.event:first-child{border-top:0}.date{width:52px;border-radius:11px;background:#eef5ff;color:var(--b);padding:8px;text-align:center;font-weight:900}.date b{display:block;font-size:18px}.event .body{flex:1}.event strong{display:block;margin:5px 0}.event small{color:var(--m)}.player{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--br);border-radius:12px;background:#fff;margin-bottom:8px}.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#eef5ff;color:var(--b);font-weight:900}.player .meta{flex:1}.player small{color:var(--m)}.sbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--br);background:#fff}.sbtn.on{background:#e7f8f0}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}.tab{border:1px solid var(--br);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--m);white-space:nowrap}.tab.on{background:var(--b);color:#fff}.builder{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:2px dashed var(--br);border-radius:15px;padding:10px;min-height:220px}.box.b{background:#f4f8ff;border-color:#9cc0ff}.box.y{background:#fffdea;border-color:#eadc67}.assign{display:flex;align-items:center;gap:7px;padding:8px;border:1px solid var(--br);border-radius:11px;background:#fff;margin:7px 0}.assign .acts{margin-left:auto;display:flex;gap:4px}.assign button{border:0;border-radius:8px;padding:6px 8px;font-weight:800}.mb{background:var(--b);color:#fff}.my{background:var(--y)}.mn{background:#edf0f5}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--br);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);z-index:10}.nav{border:0;background:transparent;padding:8px 2px;color:#74839e;font-size:11px;font-weight:800}.nav.on{color:var(--b);background:#eef5ff;border-radius:10px}.modal{position:fixed;inset:0;background:#07142e88;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:14px}.sheet{background:#fff;width:min(650px,100%);max-height:90vh;overflow:auto;border-radius:20px;padding:16px}.mh{display:flex;justify-content:space-between;align-items:center}.mh h3{font-size:24px;margin:0}.close{width:35px;height:35px;border-radius:9px;border:1px solid var(--br);background:#fff}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:900;color:var(--m);margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid var(--br);border-radius:10px}.msg{white-space:pre-wrap;background:#fbfcff;border:1px solid var(--br);border-radius:12px;padding:12px}.pitch{height:180px;background:#2a9e5a;border:3px solid #e6f8ea;border-radius:13px;position:relative;overflow:hidden}.pitch:before{content:"";position:absolute;inset:8px;border:2px solid #ffffffbb}.pitch:after{content:"";position:absolute;left:50%;top:8px;bottom:8px;border-left:2px solid #ffffffbb}.dot{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff}.dot.b{background:var(--b)}.dot.y{background:var(--y)}@media(max-width:760px){.g4,.g2{grid-template-columns:1fr 1fr}.quick{grid-template-columns:1fr 1fr}.builder{grid-template-columns:1fr}}@media(max-width:480px){.g4,.g2{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="logo">OG</div><div class="brand"><b>OSGB COACH 2020</b><small>Stagione 2026/2027</small></div></header><main id="app"></main><nav class="bottom"><button class="nav" data-r="home" onclick="go('home')">🏠<br>Home</button><button class="nav" data-r="cal" onclick="go('cal')">📅<br>Calendario</button><button class="nav" data-r="pres" onclick="go('pres')">✅<br>Presenze</button><button class="nav" data-r="team" onclick="go('team')">👥<br>Squadra</button><button class="nav" data-r="train" onclick="go('train')">🧠<br>Allenamenti</button></nav><script>const P=Array.from({length:18},(_,i)=>({id:i+1,n:'Player '+String(i+1).padStart(2,'0'),pct:[94,89,96,91,86,100,93,88,97,90,85,95,92,89,94,87,98,91][i]}));let S={r:'home',pres:JSON.parse(localStorage.getItem('pres')||'null')||Object.fromEntries(P.map(p=>[p.id,'p'])),asg:JSON.parse(localStorage.getItem('asg')||'{}'),events:[{id:1,d:'15',date:'2026-09-15',time:'17:30',t:'Allenamento',team:'ALL',place:'Campo OSGB'},{id:2,d:'19',date:'2026-09-19',time:'15:00',meet:'14:15',t:'OSGB - Aurora',team:'BLU',place:'Campo OSGB',addr:"Via D'Azeglio, Giussano"},{id:3,d:'19',date:'2026-09-19',time:'16:30',meet:'15:45',t:'Virtus - OSGB',team:'GIALLA',place:'Centro Sportivo Virtus',addr:'Via Roma 10'}],match:2};const app=document.getElementById('app');function save(){localStorage.setItem('pres',JSON.stringify(S.pres));localStorage.setItem('asg',JSON.stringify(S.asg))}function go(r){S.r=r;render();scrollTo(0,0)}function ttl(a,b){return `<h1 class="title">${a}</h1><p class="sub">${b}</p>`}function ev(e){return `<div class="event"><div class="date">SET<b>${e.d}</b></div><div class="body"><span class="pill ${e.team==='GIALLA'?'py':''}">${e.team==='BLU'?'🔵 BLU':e.team==='GIALLA'?'🟡 GIALLA':'⚽ ALLENAMENTO'}</span><strong>${e.t}</strong><small>${e.time}${e.meet?' · Ritrovo '+e.meet:''} · ${e.place}</small></div>${e.team!=='ALL'?`<button class="btn alt" onclick="openMatch(${e.id})">Apri</button>`:''}</div>`}function home(){let pc=Object.values(S.pres).filter(x=>x==='p').length;return `${ttl('Dashboard','OSGB Giussano · Scuola Calcio 2020')}<div class="grid g4"><div class="card blue"><div class="muted">PROSSIMO ALLENAMENTO</div><div class="kpi">MAR 15</div><p>17:30 · Campo OSGB</p></div><div class="card"><span class="pill">🔵 SQUADRA BLU</span><h3>OSGB - Aurora</h3><p class="muted">15:00 · Campo OSGB</p><button class="btn alt" onclick="openMatch(2)">Convocazioni</button></div><div class="card yellow"><span class="pill py">🟡 SQUADRA GIALLA</span><h3>Virtus - OSGB</h3><p class="muted">16:30 · Centro Sportivo Virtus</p><button class="btn alt" onclick="openMatch(3)">Convocazioni</button></div><div class="card"><div class="muted">ULTIME PRESENZE</div><div class="kpi">${pc}/18</div><p class="muted">${Math.round(pc/18*100)}% presenti</p></div></div><div class="section">AZIONI RAPIDE</div><div class="quick"><button onclick="go('pres')">✅<br>Segna presenze</button><button onclick="trainingWizard()">✨<br>Crea allenamento</button><button onclick="newMatch()">⚽<br>Nuova partita</button><button onclick="messages()">💬<br>Messaggi WhatsApp</button></div><div class="section">QUESTA SETTIMANA</div><div class="card">${S.events.map(ev).join('')}</div>`}function cal(){return `${ttl('Calendario','Allenamenti, campionato, amichevoli e tornei')}<div class="tabs"><button class="tab on">Tutto</button><button class="tab">Allenamenti</button><button class="tab">BLU</button><button class="tab">GIALLA</button></div><div class="card">${S.events.map(ev).join('')}</div><button class="btn" style="margin-top:12px" onclick="newMatch()">+ Nuova gara</button>`}function pres(){let c={p:0,a:0,l:0,u:0};Object.values(S.pres).forEach(x=>c[x]++);return `${ttl('Presenze','Allenamento · oggi 17:30')}<div class="grid g4"><div class="card"><b>Presenti</b><div class="kpi">${c.p}</div></div><div class="card"><b>Assenti</b><div class="kpi">${c.a}</div></div><div class="card"><b>Ritardo</b><div class="kpi">${c.l}</div></div><div class="card"><b>Indisponibili</b><div class="kpi">${c.u}</div></div></div><div class="section">GIOCATORI</div>${P.map(p=>`<div class="player"><div class="av">${p.id}</div><div class="meta"><b>${p.n}</b><br><small>Presenze stagione ${p.pct}%</small></div>${[['p','✓'],['a','✕'],['l','⏱'],['u','—']].map(x=>`<button class="sbtn ${S.pres[p.id]===x[0]?'on':''}" onclick="setPres(${p.id},'${x[0]}')">${x[1]}</button>`).join('')}</div>`).join('')}`}function setPres(id,v){S.pres[id]=v;save();render()}function team(){let a=S.asg[S.match]||{};return `${ttl('Squadra','18 bambini · BLU e GIALLA dinamiche per ogni gara')}<div class="card"><p class="muted">Nessun bambino appartiene in modo fisso a una squadra.</p><button class="btn" onclick="go('builder')">Componi BLU / GIALLA</button></div><div class="section">ROSA</div>${P.map(p=>`<div class="player"><div class="av">${p.id}</div><div class="meta"><b>${p.n}</b><br><small>Assegnazione corrente</small></div><span class="pill ${a[p.id]==='GIALLA'?'py':''}">${a[p.id]||'Non assegnato'}</span></div>`).join('')}`}function builder(){let a=S.asg[S.match]||{},g={N:[],BLU:[],GIALLA:[]};P.forEach(p=>g[a[p.id]||'N'].push(p));let row=p=>`<div class="assign"><div class="av">${p.id}</div><b>${p.n}</b><div class="acts"><button class="mb" onclick="asg(${p.id},'BLU')">BLU</button><button class="my" onclick="asg(${p.id},'GIALLA')">GIALLA</button><button class="mn" onclick="asg(${p.id},null)">×</button></div></div>`;return `${ttl('BLU / GIALLA','Composizione dinamica della giornata')}<div class="card"><b>Non assegnati: ${g.N.length}</b>${g.N.map(row).join('')}</div><div class="builder" style="margin-top:12px"><div class="box b"><h3>🔵 BLU · ${g.BLU.length}</h3>${g.BLU.map(row).join('')}</div><div class="box y"><h3>🟡 GIALLA · ${g.GIALLA.length}</h3>${g.GIALLA.map(row).join('')}</div></div>`}function asg(id,t){let a=S.asg[S.match]||{};t?a[id]=t:delete a[id];S.asg[S.match]=a;save();render()}function train(){return `${ttl('Allenamenti','Crea, archivia e riutilizza le sedute')}<div class="grid g2"><div class="card blue"><div class="muted">PROSSIMA SEDUTA</div><div class="kpi">60'</div><p>Conduzione + 1 contro 1</p></div><div class="card yellow"><b>Archivio esercizi</b><p class="muted">Schemi campo, obiettivi e varianti</p><button class="btn alt" onclick="exercises()">Apri esercizi</button></div></div><div class="section">SEDUTE</div><div class="card">${['Conduzione e 1 contro 1','Coordinazione e gioco'].map((x,i)=>`<div class="event"><div class="date">SET<b>${10-i*2}</b></div><div class="body"><strong>${x}</strong><small>60 min · Completata</small></div></div>`).join('')}</div><button class="btn" style="margin-top:12px" onclick="trainingWizard()">✨ Crea seduta</button>`}function exercises(){modal(`<div class="mh"><h3>ARCHIVIO ESERCIZI</h3><button class="close" onclick="closeM()">×</button></div><div class="card"><span class="pill">Conduzione</span><h3>Guida nel traffico</h3><p class="muted">Orientamento e controllo · 12 min</p><div class="pitch"><span class="dot b" style="left:18%;top:25%"></span><span class="dot b" style="left:28%;top:65%"></span><span class="dot y" style="right:20%;top:30%"></span><span class="dot y" style="right:30%;top:68%"></span></div></div><div class="card" style="margin-top:10px"><span class="pill py">1 contro 1</span><h3>Duello nelle porticine</h3><p class="muted">Cambio ritmo e decisione · 15 min</p></div>`)}function modal(x){document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="m"><div class="sheet">${x}</div></div>`)}function closeM(){document.getElementById('m')?.remove()}function openMatch(id){S.match=id;let e=S.events.find(x=>x.id===id);modal(`<div class="mh"><h3>${e.team==='BLU'?'🔵':'🟡'} ${e.team}</h3><button class="close" onclick="closeM()">×</button></div><h3>${e.t}</h3><p>${e.date} · ${e.time} · ritrovo ${e.meet}</p><p class="muted">${e.place}<br>${e.addr}</p><button class="btn" onclick="closeM();go('builder')">Componi squadre</button> <button class="btn y" onclick="closeM();messages()">💬 WhatsApp</button>`)}function msg(team){let e=S.events.find(x=>x.id===S.match)||S.events[1],a=S.asg[S.match]||{},list=P.filter(p=>a[p.id]===team);return `${team==='BLU'?'🔵':'🟡'} SQUADRA ${team} – OSGB GIUSSANO 2020\n\n📅 ${e.date}\n⚽ ${e.t}\n📍 ${e.place}${e.addr?' – '+e.addr:''}\n🕒 Ritrovo: ore ${e.meet||'-'}\n🕞 Inizio: ore ${e.time}\n\nConvocati:\n${list.length?list.map(p=>'• '+p.n).join('\n'):'• Da definire'}\n\nPer eventuali assenze o problemi, avvisare appena possibile.\n\nStaff OSGB Giussano 2020`}function messages(){let b=msg('BLU'),y=msg('GIALLA');modal(`<div class="mh"><h3>MESSAGGI GIORNATA</h3><button class="close" onclick="closeM()">×</button></div><h3>BLU</h3><div class="msg" id="mb">${b}</div><p><button class="btn" onclick="wa('mb')">Apri WhatsApp</button></p><h3>GIALLA</h3><div class="msg" id="my">${y}</div><p><button class="btn y" onclick="wa('my')">Apri WhatsApp</button></p>`)}function wa(id){open('https://wa.me/?text='+encodeURIComponent(document.getElementById(id).innerText),'_blank')}function newMatch(){modal(`<div class="mh"><h3>NUOVA PARTITA</h3><button class="close" onclick="closeM()">×</button></div><div class="field"><label>Squadra</label><select><option>BLU</option><option>GIALLA</option></select></div><div class="field"><label>Tipo</label><select><option>Campionato</option><option>Amichevole</option><option>Torneo</option></select></div><div class="field"><label>Data</label><input type="date" value="2026-09-26"></div><div class="field"><label>Avversario</label><input value="Nuovo avversario"></div><button class="btn" onclick="closeM();alert('Gara demo salvata')">Salva gara</button>`)}function trainingWizard(){modal(`<div class="mh"><h3>✨ CREA ALLENAMENTO</h3><button class="close" onclick="closeM()">×</button></div><div class="field"><label>Durata</label><select><option>60 min</option><option>75 min</option></select></div><div class="field"><label>Giocatori</label><input value="18"></div><div class="field"><label>Allenatori</label><input value="3"></div><div class="field"><label>Obiettivo</label><select><option>Conduzione e 1 contro 1</option><option>Coordinazione</option><option>Passaggio e ricezione</option></select></div><button class="btn" onclick="genTrain()">Genera seduta</button>`)}function genTrain(){closeM();modal(`<div class="mh"><h3>SEDUTA GENERATA · 60'</h3><button class="close" onclick="closeM()">×</button></div>${[['10 min','Attivazione'],['15 min','Conduzione'],['15 min','1 contro 1'],['15 min','Partitelle'],['5 min','Gioco finale']].map(x=>`<div class="event"><div class="date">${x[0]}</div><div class="body"><strong>${x[1]}</strong><small>18 bambini · 3 allenatori</small></div></div>`).join('')}<button class="btn" onclick="closeM();alert('Seduta demo salvata')">Salva seduta</button>`)}function render(){document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.r===S.r));app.innerHTML=({home,cal,pres,team,builder,train}[S.r]||home)()}render();</script></body></html>
